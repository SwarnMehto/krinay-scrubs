name: Meta Pixel feature quality checks

on:
  push:
    branches:
      - feature/meta-pixel-events
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "context/**"
      - "data/**"
      - "lib/**"
      - "types/**"
      - ".github/workflows/quality-checks.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Run TypeScript checks
        id: types
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build production app
        id: build
        run: npm run build
        continue-on-error: true

      - name: Fail unless every required check passes
        if: always()
        shell: bash
        run: |
          failed=0
          for result in "${{ steps.lint.outcome }}" "${{ steps.types.outcome }}" "${{ steps.build.outcome }}"; do
            if [ "$result" != "success" ]; then
              echo "Required check failed: $result"
              failed=1
            fi
          done
          exit "$failed"
